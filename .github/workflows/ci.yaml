name: CI - Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_CINE_API_URL: http://api-cine-dev.com/api/v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          build-args: |
            VITE_CINE_API_URL=http://api-cine-dev.com/api/v1
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-cine-dip:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-cine-dip:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
